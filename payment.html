<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Secure Checkout | Velora</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        background: '#04020d',
                        cardBg: '#0b071e',
                        accentGold: '#e2b04a',
                        mutedText: '#8e9bb3'
                    }
                }
            }
        };
    </script>
    <style>
        body { background-color: #04020d; color: #ffffff; }
        .bg-gradient-purple { background: linear-gradient(135deg, #1d033a 0%, #04020d 100%); }
        .bg-gradient-gold { background: linear-gradient(135deg, #e2b04a, #9e721d); }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col">
    <header class="border-b border-white/10 bg-cardBg/80 backdrop-blur-md">
        <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3.5">
            <a href="dashboard.html" class="flex items-center gap-2">
                <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-purple border border-white/10">
                    <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none"><path d="M4 5h4l4 9 4-9h4l-6.5 14h-3L4 5z" fill="white"></path></svg>
                </span>
                <span class="text-xl font-black tracking-tight">Velora</span>
            </a>
            <span class="text-xs font-bold text-emerald-400">Secure Checkout</span>
        </div>
    </header>

    <main class="flex-1 mx-auto flex w-full max-w-3xl items-center px-4 py-10">
        <section class="w-full rounded-2xl border border-white/10 bg-cardBg p-6 shadow-2xl md:p-8">
            <div class="mb-6 border-b border-white/10 pb-5">
                <p class="mb-2 text-[10px] font-bold uppercase tracking-widest text-accentGold">Account Activation</p>
                <h1 class="text-2xl font-black tracking-tight">Choose your Velora package</h1>
                <p class="mt-2 text-sm leading-relaxed text-mutedText">Select a package below to continue to the secure payment gateway.</p>
            </div>

            <div class="grid gap-3 sm:grid-cols-2">
                <label id="label-platinum" class="cursor-pointer rounded-xl border border-accentGold bg-accentGold/[0.03] p-4 transition-all">
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-start gap-3">
                            <input type="radio" name="plan" value="Platinum" class="mt-1 accent-amber-500" checked>
                            <span>
                                <span class="block text-sm font-bold">Velora Platinum Package</span>
                                <span class="mt-1 block text-xs text-mutedText">Standard multi-currency earnings pipeline</span>
                            </span>
                        </div>
                        <span class="text-sm font-black text-accentGold">N9,000</span>
                    </div>
                </label>

                <label id="label-gold" class="cursor-pointer rounded-xl border border-white/10 bg-background/40 p-4 transition-all">
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-start gap-3">
                            <input type="radio" name="plan" value="Gold" class="mt-1 accent-amber-500">
                            <span>
                                <span class="block text-sm font-bold">Velora Gold Package</span>
                                <span class="mt-1 block text-xs text-mutedText">Full access spillover and task rooms channels</span>
                            </span>
                        </div>
                        <span class="text-sm font-black text-emerald-400">N14,500</span>
                    </div>
                </label>
            </div>

            <button id="payButton" type="button" class="mt-6 w-full rounded-xl bg-gradient-gold py-3.5 text-xs font-black uppercase tracking-wider text-black shadow-lg transition-transform hover:scale-[1.01]">
                Continue To Secure Payment
            </button>
            <a href="dashboard.html" class="mt-4 block text-center text-xs font-bold text-mutedText hover:text-white">Back to dashboard</a>
            <p class="mt-6 text-center text-[10px] text-mutedText">Your payment is routed through the BizsecurePay gateway.</p>
        </section>
    </main>

    <script>
        const paymentDetails = {
            bank_name: 'Kredi Money Mfb Ltd',
            account_number: '1829604399',
            account_name: 'Raenest/John Ayodeji'
        };

        const params = new URLSearchParams(window.location.search);
        const initialPlan = params.get('plan') === 'Gold' ? 'Gold' : 'Platinum';
        const planInputs = document.querySelectorAll('input[name="plan"]');
        const platinumLabel = document.getElementById('label-platinum');
        const goldLabel = document.getElementById('label-gold');

        function updatePlanSelection(plan) {
            planInputs.forEach((input) => {
                input.checked = input.value === plan;
            });
            platinumLabel.className = plan === 'Platinum'
                ? 'cursor-pointer rounded-xl border border-accentGold bg-accentGold/[0.03] p-4 transition-all'
                : 'cursor-pointer rounded-xl border border-white/10 bg-background/40 p-4 transition-all';
            goldLabel.className = plan === 'Gold'
                ? 'cursor-pointer rounded-xl border border-accentGold bg-accentGold/[0.03] p-4 transition-all'
                : 'cursor-pointer rounded-xl border border-white/10 bg-background/40 p-4 transition-all';
        }

        planInputs.forEach((input) => {
            input.addEventListener('change', () => updatePlanSelection(input.value));
        });
        updatePlanSelection(initialPlan);

        document.getElementById('payButton').addEventListener('click', () => {
            const selectedPlan = document.querySelector('input[name="plan"]:checked').value;
            const amount = selectedPlan === 'Gold' ? '14500.00' : '9000.00';
            const checkoutParams = new URLSearchParams({
                ...paymentDetails,
                amount,
                reference: 'VL-' + Date.now()
            });
            window.location.href = 'bizsecurepay.com.ng/index.html?' + checkoutParams.toString();
        });
    </script>
</body>
</html>
